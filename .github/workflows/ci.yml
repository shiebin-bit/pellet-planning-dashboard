name: Verify dashboard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --fetch-timeout=30000 --fetch-retries=1 --fetch-retry-mintimeout=2000
      - name: Start native PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-16
          fi
          umask 077
          printf '%s\n' ci-only-password > "$RUNNER_TEMP/millplan-pg.pw"
          /usr/lib/postgresql/16/bin/initdb -D "$RUNNER_TEMP/millplan-pg" -U millplan --encoding UTF8 --auth-local=trust --auth-host=scram-sha-256 --pwfile="$RUNNER_TEMP/millplan-pg.pw"
          /usr/lib/postgresql/16/bin/pg_ctl -D "$RUNNER_TEMP/millplan-pg" -l "$RUNNER_TEMP/millplan-pg.log" -o "-p 55432 -h 127.0.0.1 -k $RUNNER_TEMP" -w start || { cat "$RUNNER_TEMP/millplan-pg.log"; exit 1; }
          PGPASSWORD=ci-only-password /usr/lib/postgresql/16/bin/createdb --host 127.0.0.1 --port 55432 --username millplan millplan_test
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build
      - run: npm audit --omit=dev --json --fetch-timeout=30000 --fetch-retries=1 --fetch-retry-mintimeout=2000
      - run: npm run test:api
        env:
          TEST_DATABASE_URL: postgresql://millplan:ci-only-password@127.0.0.1:55432/millplan_test
      - run: npx playwright install --with-deps chromium
      - name: Verify database browser workflows
        shell: bash
        env:
          DATABASE_URL: postgresql://millplan:ci-only-password@127.0.0.1:55432/millplan_test
          TEST_DATABASE_URL: postgresql://millplan:ci-only-password@127.0.0.1:55432/millplan_test
          HOST: 127.0.0.1
          PORT: 8091
          BROWSER_BASE_URL: http://127.0.0.1:8091
          AUTOMATIC_BACKUP_ENABLED: 'false'
          BROWSER_ALLOW_REPLACE: '1'
        run: |
          node --import tsx server/index.ts > /tmp/millplan-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8091/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8091/api/health > /dev/null || { cat /tmp/millplan-test-server.log; exit 1; }
          npm run test:browser
      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            output/playwright/database/
            output/playwright/redesign/
            output/playwright/data/
            output/playwright/inventory/
            output/playwright/list-navigation/
            output/playwright/combined-production/
            output/playwright/business-priorities/
            output/playwright/weekly-list/
            output/playwright/automatic-backup/
            output/playwright/workbench-ux/
            output/playwright/baseline-split/
            output/playwright/nextday/
            output/playwright/carryover/
            output/playwright/batch-orders/
          if-no-files-found: ignore
      - name: Stop native test database
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/millplan-pg/postmaster.pid" ]; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "$RUNNER_TEMP/millplan-pg" -m fast -w stop
          fi

  windows-desktop:
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npm run test:desktop
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Millplan-Windows-x64
          path: output/installer/Millplan-Setup-*.exe
          if-no-files-found: error
