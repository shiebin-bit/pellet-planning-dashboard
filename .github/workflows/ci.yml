name: Verify dashboard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --fetch-timeout=30000 --fetch-retries=1 --fetch-retry-mintimeout=2000
      - name: Start native PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          if ! pg_lsclusters --no-header | awk '$1 == "16" && $2 == "main" { found=1 } END { exit !found }'; then
            sudo pg_createcluster 16 main --port 5432
          fi
          sudo pg_conftool 16 main set port 5432
          sudo pg_conftool 16 main set listen_addresses 127.0.0.1
          sudo pg_ctlcluster 16 main restart
          sudo -u postgres psql --set ON_ERROR_STOP=1 --command "CREATE ROLE millplan LOGIN SUPERUSER PASSWORD 'ci-only-password'"
          sudo -u postgres createdb --owner millplan millplan_test
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build
      - run: npm audit --omit=dev --json --fetch-timeout=30000 --fetch-retries=1 --fetch-retry-mintimeout=2000
      - run: npm run test:api
        env:
          TEST_DATABASE_URL: postgresql://millplan:ci-only-password@127.0.0.1:5432/millplan_test
      - run: npx playwright install --with-deps chromium
      - name: Verify database browser workflows
        shell: bash
        env:
          DATABASE_URL: postgresql://millplan:ci-only-password@127.0.0.1:5432/millplan_test
          TEST_DATABASE_URL: postgresql://millplan:ci-only-password@127.0.0.1:5432/millplan_test
          HOST: 127.0.0.1
          PORT: 8091
          BROWSER_BASE_URL: http://127.0.0.1:8091
          AUTOMATIC_BACKUP_ENABLED: 'false'
          BROWSER_ALLOW_REPLACE: '1'
        run: |
          node --import tsx server/index.ts > /tmp/millplan-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8091/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8091/api/health > /dev/null || { cat /tmp/millplan-test-server.log; exit 1; }
          npm run test:browser
      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            output/playwright/database/
            output/playwright/redesign/
            output/playwright/data/
            output/playwright/inventory/
            output/playwright/list-navigation/
            output/playwright/combined-production/
            output/playwright/business-priorities/
            output/playwright/weekly-list/
            output/playwright/automatic-backup/
            output/playwright/workbench-ux/
            output/playwright/baseline-split/
            output/playwright/nextday/
            output/playwright/carryover/
            output/playwright/batch-orders/
          if-no-files-found: ignore

  windows-desktop:
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit
      - run: npm run test:desktop
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Millplan-Windows-x64
          path: output/installer/Millplan-Setup-*.exe
          if-no-files-found: error
