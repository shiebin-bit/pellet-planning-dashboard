name: Verify dashboard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: millplan_test
          POSTGRES_USER: millplan
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U millplan -d millplan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate --fetch-timeout=30000 --fetch-retries=1 --fetch-retry-mintimeout=2000
      - run: npm run test:api
        env:
          TEST_DATABASE_URL: postgresql://millplan:ci-only-password@127.0.0.1:5432/millplan_test
      - run: npx playwright install --with-deps chromium
      - name: Verify database browser workflows
        shell: bash
        env:
          DATABASE_URL: postgresql://millplan:ci-only-password@127.0.0.1:5432/millplan_test
          HOST: 127.0.0.1
          PORT: 8091
          BROWSER_BASE_URL: http://127.0.0.1:8091
          BROWSER_ALLOW_REPLACE: '1'
        run: |
          node --import tsx server/index.ts > /tmp/millplan-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8091/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8091/api/health > /dev/null || { cat /tmp/millplan-test-server.log; exit 1; }
          npm run test:browser
      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            output/playwright/database/
            output/playwright/redesign/
            output/playwright/data/
          if-no-files-found: ignore
